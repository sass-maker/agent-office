name: Site Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check browser script syntax
        run: node --check site/script.js
      - name: Check site release gates
        run: node scripts/check-site.mjs
